name: release

# Triggered by pushing a tag like v1.0.0. Builds the plugin (cmake) +
# publishes UevrMcpServer.exe (self-contained single-file), bundles the
# result via tools/package-release.ps1, and attaches the zip to a
# GitHub Release.
#
# Manual runs (workflow_dispatch) just build the zip and upload it as a
# workflow artifact — handy for smoke-testing changes before tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the zip name (e.g. 1.0.0). Used when no tag is pushed.'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSVC / Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } elseif ($env:INPUTS_VERSION) {
            $v = $env:INPUTS_VERSION
          } else {
            $v = 'dev'
          }
          Write-Host "version=$v"
          "version=$v" >> $env:GITHUB_OUTPUT
        env:
          INPUTS_VERSION: ${{ github.event.inputs.version }}

      - name: Package release
        shell: pwsh
        run: .\tools\package-release.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UevrMcp-v${{ steps.ver.outputs.version }}
          path: dist/UevrMcp-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UevrMcp-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
